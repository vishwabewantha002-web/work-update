<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work Update</title>
<meta name="theme-color" content="#0f766e">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#f4f6fb;--surface:#fff;--ink:#0f172a;--muted:#64748b;--line:#e4e8f0;--accent:#0f766e;--bad:#dc2626}
  @media (prefers-color-scheme: dark){:root{--bg:#0b1120;--surface:#111a2e;--ink:#e5eaf3;--muted:#94a3b8;--line:#1f2a40;--accent:#2dd4bf;--bad:#f87171}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}
  /* loading */
  #splash{position:fixed;inset:0;display:grid;place-items:center;gap:14px;background:var(--bg);z-index:5;transition:opacity .35s}
  #splash.gone{opacity:0;pointer-events:none}
  .sp-in{display:grid;justify-items:center;gap:14px}
  .sp-in img{width:76px;height:76px;border-radius:20px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
  .sp-in b{font-size:20px;letter-spacing:-.01em}
  .bar{width:160px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
  .bar i{display:block;width:40%;height:100%;background:var(--accent);border-radius:4px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  .slow{font-size:13px;color:var(--muted);max-width:320px;text-align:center}
  .slow a{color:var(--accent)}
  /* first-time setup */
  #setup{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg);z-index:6}
  .card{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 40px rgba(15,23,42,.10)}
  .card img{width:56px;height:56px;border-radius:15px;display:block;margin-bottom:12px}
  .card h1{margin:0 0 6px;font-size:22px;letter-spacing:-.02em}
  .card p{margin:0 0 14px;color:var(--muted)}
  .card label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
  .card input[type=url]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--surface);color:var(--ink)}
  .card input[type=url]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  .chk{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:13px;cursor:pointer;font-weight:500!important}
  .err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 0 0}
  .go{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:600 15px system-ui,"Segoe UI",sans-serif;cursor:pointer}
  @media (prefers-color-scheme: dark){.go{color:#04201c}}
  /* tool strip: hover the very top of the window */
  #hot{position:fixed;left:30%;right:30%;top:0;height:6px;z-index:7}
  #tools{position:fixed;top:8px;left:50%;transform:translate(-50%,-140%);display:flex;gap:4px;padding:5px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);z-index:8;transition:transform .2s,visibility .2s;backdrop-filter:blur(8px);visibility:hidden}
  #tools.show{transform:translate(-50%,0);visibility:visible}
  #tools button{border:0;background:none;color:var(--ink);font:600 13px system-ui,"Segoe UI",sans-serif;padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
  #tools button:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
  #hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:8;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
  #hint.show{opacity:.92}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="setup" hidden>
  <form class="card" id="setupForm" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>Work Update</h1>
    <p>One-time setup on this computer. Paste the link of your Work Update system (it ends in <b>/exec</b>).</p>
    <label for="url">Work Update link</label>
    <input id="url" type="url" required placeholder="https://script.google.com/macros/s/…/exec">
    <label class="chk"><input type="checkbox" id="edit" checked> Open the editing view (asks for your PIN)</label>
    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit">Open Work Update</button>
  </form>
</div>

<div id="splash" hidden>
  <div class="sp-in">
    <img src="icon-192.png" alt="">
    <b>Work Update</b>
    <div class="bar"><i></i></div>
    <div class="slow" id="slow" hidden>Taking a while… <a id="direct" href="#" target="_blank" rel="noopener">Open it in a browser tab instead</a></div>
  </div>
</div>

<iframe id="app" title="Work Update" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>

<div id="hot" aria-hidden="true"></div>
<div id="tools" role="toolbar" aria-label="Window">
  <button type="button" id="tFull">⛶ Full screen</button>
  <button type="button" id="tReload">↻ Reload</button>
  <button type="button" id="tLink">⚙ Change link</button>
</div>
<div id="hint"></div>

<script>
(function () {
  var KEY = 'wu-app-url', $ = function (id) { return document.getElementById(id); };
  var RX = /^https:\/\/script\.google\.com\/(a\/(macros\/)?[^\/]+\/)?macros\/s\/[\w-]+\/(exec|dev)/;

  function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function put(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (e) {} }

  // a link can also be passed once as  ?u=<link>  (it is then saved and removed from the address bar)
  try {
    var q = new URLSearchParams(location.search).get('u');
    if (q && RX.test(q)) { put(q); history.replaceState(null, '', location.pathname); }
  } catch (e) {}

  function hint(msg, ms) {
    var h = $('hint'); h.textContent = msg; h.classList.add('show');
    clearTimeout(hint.t); hint.t = setTimeout(function () { h.classList.remove('show'); }, ms || 3500);
  }
  function isFull() {
    return !!document.fullscreenElement || (window.matchMedia && matchMedia('(display-mode: fullscreen)').matches) ||
      (Math.abs(window.innerHeight - screen.height) < 3 && Math.abs(window.innerWidth - screen.width) < 3);
  }
  function syncFullBtn() { $('tFull').textContent = isFull() ? '🗗 Exit full screen' : '⛶ Full screen'; }
  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); return; }
    if (isFull()) { hint('Press F11 to leave full screen'); return; }
    var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(function () { hint('Press F11 for full screen'); });
  }

  function open(link) {
    $('setup').hidden = true;
    var sp = $('splash'), f = $('app');
    sp.hidden = false; sp.classList.remove('gone'); $('slow').hidden = true;
    $('direct').href = link;
    var slow = setTimeout(function () { $('slow').hidden = false; }, 12000);
    f.hidden = false;
    f.onload = function () { clearTimeout(slow); sp.classList.add('gone'); setTimeout(function () { sp.hidden = true; }, 400); };
    f.src = link;
    document.title = 'Work Update';
    if (!isFull()) setTimeout(function () { hint('Tip: point at the top edge for Full screen, or press F11', 4500); }, 1500);
  }
  function setup(msg) {
    $('app').hidden = true; $('splash').hidden = true; $('setup').hidden = false;
    var cur = get(); $('url').value = cur.replace(/\?.*$/, ''); $('edit').checked = !cur || /page=edit/.test(cur);
    $('err').textContent = msg || ''; setTimeout(function () { $('url').focus(); }, 50);
  }

  $('setupForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = $('url').value.trim().replace(/[?#].*$/, '');
    if (!RX.test(v)) { $('err').textContent = 'That doesn’t look like the system link. Copy it from the address bar when the system is open: it starts with https://script.google.com/ and ends in /exec.'; return; }
    v = v.replace(/\/dev$/, '/exec') + ($('edit').checked ? '?page=edit' : '');
    put(v);
    // the click on "Open" counts as a user action, so full screen is allowed here
    if (!isFull() && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {});
    open(v);
  });

  // tool strip
  var tools = $('tools'), hideT;
  function showTools() { syncFullBtn(); tools.classList.add('show'); clearTimeout(hideT); }
  function hideTools() { clearTimeout(hideT); hideT = setTimeout(function () { tools.classList.remove('show'); }, 900); }
  $('hot').addEventListener('mouseenter', showTools);
  $('hot').addEventListener('click', showTools);
  tools.addEventListener('mouseenter', showTools);
  tools.addEventListener('mouseleave', hideTools);
  $('tFull').addEventListener('click', function () { toggleFull(); hideTools(); });
  $('tReload').addEventListener('click', function () { var l = get(); if (l) open(l); tools.classList.remove('show'); });
  $('tLink').addEventListener('click', function () { tools.classList.remove('show'); setup(); });
  document.addEventListener('fullscreenchange', syncFullBtn);

  var link = get();
  if (link) open(link); else setup();

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
